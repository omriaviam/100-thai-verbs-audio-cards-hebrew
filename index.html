<!doctype html>

<meta charset="utf-8">

<title>100 Thai Verbs — כרטיסיות שמע</title>
<style>
  :root{
    --bg:#154f48;
    --panel:#0f403a;
    --text:#fff;
    --muted:rgba(255,255,255,.72);
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai",Tahoma,sans-serif;
    min-height:100vh;
  }
  .wrap{width:min(1450px,96%);margin:0 auto;padding:26px 0 40px}
  .header{text-align:center;margin-bottom:18px}
  h1{margin:0 0 6px;font-size:clamp(25px,2.7vw,38px)}
  .sub{color:var(--muted);font-size:14px}
  .toolbar{
    display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;
    margin:18px auto 22px;
  }
  .search{
    width:min(420px,100%);background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);
    color:white;border-radius:14px;padding:11px 14px;font-size:15px;outline:none;
  }
  .search::placeholder{color:rgba(255,255,255,.58)}
  .filter{
    border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);
    color:white;border-radius:999px;padding:8px 12px;cursor:pointer;font-weight:700;font-size:13px;
  }
  .filter.active{background:white;color:#184f48}
  .grid{
    direction:ltr;
    display:grid;
    grid-template-columns:repeat(5,minmax(0,1fr));
    gap:12px;
  }
  .card{
    position:relative;
    direction:rtl;
    min-height:175px;
    border:1px solid rgba(255,255,255,.14);
    border-top:5px solid var(--accent);
    background:rgba(255,255,255,.085);
    color:white;
    border-radius:17px;
    padding:10px 12px 12px;
    cursor:pointer;
    box-shadow:0 5px 14px rgba(0,0,0,.10);
    transition:transform .12s ease, background .12s ease, box-shadow .12s ease;
  }
  .card:hover{transform:translateY(-2px);background:rgba(255,255,255,.12)}
  .card:active{transform:scale(.985)}
  .card.playing{
    outline:3px solid rgba(255,255,255,.92);
    outline-offset:2px;
    box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 30%,transparent);
  }
  .topline{direction:ltr;display:flex;align-items:center;justify-content:space-between;height:26px}
  .num{
    min-width:26px;height:26px;border-radius:9px;background:rgba(255,255,255,.12);
    display:grid;place-items:center;font-size:12px;font-weight:800;
  }
  .play{
    width:26px;height:26px;border-radius:50%;background:var(--accent);
    display:grid;place-items:center;font-size:11px;
  }
  .thai{font-size:32px;font-weight:850;text-align:center;line-height:1.12;margin-top:4px}
  .roman{direction:ltr;text-align:center;font-size:17px;font-weight:800;margin-top:5px}
  .meaning{
    position:relative;
    text-align:center;
    font-size:15px;
    font-weight:750;
    margin-top:8px;
    line-height:1.25;
    min-height:37px;
    color:transparent;
    text-shadow:none;
    transition:color .16s ease;
  }
  .meaning::after{
    content:"???";
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    color:rgba(255,255,255,.86);
    border-radius:10px;
    background:rgba(255,255,255,.11);
    letter-spacing:2px;
    transition:opacity .16s ease, transform .16s ease;
  }
  .card.revealed .meaning{color:white}
  .card.revealed .meaning::after{opacity:0;transform:scale(.96);pointer-events:none}
  .setname{text-align:center;font-size:11px;color:var(--muted);margin-top:6px}
  #status{text-align:center;min-height:24px;margin-top:18px;font-size:14px;color:var(--muted)}
  .hidden{display:none!important}
  @media(max-width:1100px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
  @media(max-width:850px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media(max-width:620px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
    .card{min-height:165px;padding:9px}
    .thai{font-size:29px} .meaning{font-size:14px}
  }
  @media(max-width:360px){.grid{grid-template-columns:1fr}}
</style>

let activeFilter = "all";
let currentButton = null;
const revealTimers = new WeakMap();
const player = document.getElementById("player");
const status = document.getElementById("status");

function audioSrc(index){
  return "audio/word-" + String(index + 1).padStart(3, "0") + ".mp3";
}

function setFilter(value, btn){
  activeFilter = value;
  document.querySelectorAll(".filter").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  applyFilters();
}

function applyFilters(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  document.querySelectorAll(".card").forEach(card => {
    const setOk = activeFilter === "all" || card.dataset.set === activeFilter;
    const qOk = !q || card.dataset.search.toLowerCase().includes(q);
    card.classList.toggle("hidden", !(setOk && qOk));
  });
}

function resetButtons(){
  document.querySelectorAll(".card").forEach(b => b.classList.remove("playing"));
}

function revealMeaning(button){
  document.querySelectorAll(".card.revealed").forEach(card => {
    if (card !== button) {
      const timer = revealTimers.get(card);
      if (timer) clearTimeout(timer);
      card.classList.remove("revealed");
    }
  });
  const previousTimer = revealTimers.get(button);
  if (previousTimer) clearTimeout(previousTimer);
  button.classList.add("revealed");
  revealTimers.set(button, setTimeout(() => {
    button.classList.remove("revealed");
    revealTimers.delete(button);
  }, 3000));
}

function playWord(index, button){
  const item = words[index];
  currentButton = button;
  resetButtons();
  button.classList.add("playing");
  revealMeaning(button);
  status.textContent = "מנגן: " + item.thai + " (" + item.roman + ")";
  player.pause();
  player.src = audioSrc(index);
  player.currentTime = 0;
  const p = player.play();
  if (p && p.catch) p.catch(failAudio);
}

function failAudio(){
  resetButtons();
  status.textContent = "לא הצלחתי לנגן את קובץ השמע. רענן את העמוד ונסה שוב.";
}

player.addEventListener("ended", () => {
  resetButtons();
  status.textContent = "";
});

player.addEventListener("error", failAudio);

</script>
